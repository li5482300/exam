<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="配線考試">
<meta name="theme-color" content="#185FA5">
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icon-192.png">
<title>室內配線學科考試系統</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
body { font-family: "Microsoft JhengHei", "PingFang TC", "Helvetica Neue", sans-serif; background: #f4f4ef; color: #1a1a1a; min-height: 100vh; font-size: 16px; }
.container { max-width: 680px; margin: 0 auto; padding: 20px 14px 40px; }
.hidden { display: none !important; }

/* ── 首頁 ── */
h1 { font-size: 20px; font-weight: 700; margin-bottom: 3px; line-height: 1.3; }
.subtitle { font-size: 12px; color: #999; margin-bottom: 22px; line-height: 1.5; }
.section-title { font-size: 12px; font-weight: 700; color: #888; letter-spacing: .5px; margin: 22px 0 10px; text-transform: uppercase; }

/* 卡片網格：手機單欄，平板雙欄 */
.card-grid { display: grid; grid-template-columns: 1fr; gap: 10px; margin-bottom: 4px; }
@media (min-width: 480px) { .card-grid { grid-template-columns: 1fr 1fr; } }

.menu-card { border: 1.5px solid #e0e0d8; border-radius: 14px; padding: 16px; cursor: pointer; background: #fff; display: flex; align-items: center; gap: 14px; transition: border-color .15s, background .15s; user-select: none; -webkit-user-select: none; }
.menu-card:active { background: #f0f6ff; border-color: #185FA5; }
.menu-card.active { border-color: #185FA5; background: #E6F1FB; }
.menu-card .icon { font-size: 28px; flex-shrink: 0; }
.menu-card .mc-title { font-size: 15px; font-weight: 700; line-height: 1.3; }
.menu-card .mc-desc { font-size: 12px; color: #aaa; margin-top: 3px; }
.menu-card.active .mc-title { color: #185FA5; }
.menu-card.active .mc-desc { color: #185FA5; }

/* ── 標籤 ── */
.tags { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
.tag { padding: 8px 16px; border-radius: 22px; border: 1.5px solid #ddd; background: #fff; color: #888; font-size: 14px; cursor: pointer; font-family: inherit; transition: all .15s; user-select: none; }
.tag:active { opacity: .7; }
.tag.tw { border-color:#185FA5; background:#E6F1FB; color:#185FA5; font-weight:700; }
.tag.ts { border-color:#3B6D11; background:#EAF3DE; color:#3B6D11; font-weight:700; }
.tag.te { border-color:#534AB7; background:#EEEDFE; color:#534AB7; font-weight:700; }
.tag.tv { border-color:#0F6E56; background:#E1F5EE; color:#0F6E56; font-weight:700; }
.tag.tn { border-color:#854F0B; background:#FAEEDA; color:#854F0B; font-weight:700; }

/* ── 按鈕 ── */
.btn-go { width:100%; padding:16px; background:#185FA5; color:#fff; border:none; border-radius:12px; font-size:16px; font-weight:700; cursor:pointer; font-family:inherit; margin-top:6px; -webkit-appearance:none; }
.btn-go:active { background:#0e4880; }
.btn-sec { width:100%; padding:15px; background:#eeeee8; color:#444; border:none; border-radius:12px; font-size:15px; cursor:pointer; font-family:inherit; -webkit-appearance:none; }
.btn-sec:active { background:#ddddd5; }
.btn-back { background:none; border:none; cursor:pointer; color:#888; font-size:15px; font-family:inherit; padding:8px 0; display:flex; align-items:center; gap:5px; min-height:44px; }
.btn-back:active { color:#333; }

/* ── 滑桿 ── */
.range-row { display:flex; align-items:center; gap:12px; margin-bottom:16px; }
.range-row label { font-size:14px; color:#666; white-space:nowrap; }
input[type=range] { flex:1; accent-color:#185FA5; height:6px; }
.range-val { font-size:16px; font-weight:700; min-width:30px; text-align:right; }

/* ── 科目列表 ── */
.subj-list { display:grid; gap:10px; margin-bottom:18px; }
.subj-item { border:1.5px solid #e0e0d8; border-radius:12px; padding:16px; cursor:pointer; background:#fff; display:flex; justify-content:space-between; align-items:center; min-height:56px; }
.subj-item:active { background:#f0f6ff; border-color:#185FA5; }
.subj-name { font-weight:700; font-size:15px; }
.subj-count { font-size:13px; color:#aaa; }

/* ── 題目頁面 固定底部導航 ── */
#quiz-screen { padding-bottom: 0; }
.quiz-body { padding: 16px 14px 0; max-width: 680px; margin: 0 auto; }
.quiz-footer { position: sticky; bottom: 0; background: #f4f4ef; border-top: 1px solid #e0e0d8; padding: 12px 14px; max-width: 680px; margin: 0 auto; }

.quiz-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; padding: 0 2px; }
.q-counter { font-size:14px; color:#888; font-weight:600; }
.timer { font-size:16px; font-weight:700; color:#185FA5; }
.timer.urgent { color:#c0392b; }
.progress-bar { height:6px; background:#e8e8e0; border-radius:4px; margin-bottom:20px; overflow:hidden; }
.progress-fill { height:100%; background:#185FA5; border-radius:4px; transition:width .3s; }
.subj-badge { display:inline-block; font-size:12px; font-weight:700; padding:4px 12px; border-radius:14px; margin-bottom:12px; }
.q-text { font-size:17px; font-weight:700; line-height:1.7; margin-bottom:20px; }

/* ── 選項 ── */
.opts { display:grid; gap:11px; margin-bottom:4px; }
.opt { border:2px solid #e0e0d8; border-radius:12px; padding:14px 16px; cursor:pointer; background:#fff; display:flex; align-items:flex-start; gap:12px; transition:border-color .1s, background .1s; user-select:none; min-height:52px; }
.opt:active:not(.locked) { background:#f0f6ff; border-color:#185FA5; }
.opt.selected { border-color:#185FA5; background:#E6F1FB; }
.opt.correct  { border-color:#2e7d32; background:#e8f5e9; }
.opt.wrong    { border-color:#c62828; background:#ffebee; }
.opt.locked   { cursor:default; }
.opt-num { min-width:28px; height:28px; border-radius:14px; background:#e8e8e0; display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:700; flex-shrink:0; }
.opt.selected .opt-num { background:#185FA5; color:#fff; }
.opt.correct  .opt-num { background:#2e7d32; color:#fff; }
.opt.wrong    .opt-num { background:#c62828; color:#fff; }
.opt-text { font-size:15px; line-height:1.55; padding-top:3px; }

/* ── 導航按鈕（底部） ── */
.nav-row { display:flex; gap:10px; }
.nav-btn { flex:1; padding:15px 10px; border:2px solid #ddd; border-radius:12px; background:#fff; font-size:15px; cursor:pointer; font-family:inherit; font-weight:600; min-height:52px; }
.nav-btn:active { background:#f0f0eb; }
.nav-btn.active-next { background:#185FA5; color:#fff; border-color:#185FA5; }
.nav-btn.active-next:active { background:#0e4880; }
.nav-btn.finish { background:#2e7d32; color:#fff; border-color:#2e7d32; font-weight:700; }
.nav-btn.finish:active { background:#1b5e20; }

/* ── 結果畫面 ── */
.score-card { border-radius:16px; padding:28px 20px; text-align:center; margin-bottom:20px; }
.score-card.pass { background:#e8f5e9; border:2px solid #2e7d32; }
.score-card.fail { background:#ffebee; border:2px solid #c62828; }
.score-num { font-size:64px; font-weight:700; }
.score-card.pass .score-num { color:#2e7d32; }
.score-card.fail .score-num { color:#c62828; }
.score-lbl { font-size:16px; margin-top:6px; font-weight:600; }
.score-card.pass .score-lbl { color:#2e7d32; }
.score-card.fail .score-lbl { color:#c62828; }
.result-list { display:grid; gap:10px; margin-bottom:16px; }
.ri { border-radius:12px; padding:14px; }
.ri.ok { background:#e8f5e9; border:1.5px solid #a5d6a7; }
.ri.ng { background:#ffebee; border:1.5px solid #ef9a9a; }
.ri-q { font-size:14px; font-weight:700; color:#333; margin-bottom:8px; line-height:1.55; }
.ri-ans { font-size:13px; line-height:2; }
.ans-ok { color:#2e7d32; font-weight:700; }
.ans-ng { color:#c62828; }

/* ── 閱讀：條列 ── */
.read-list-wrap { display:grid; gap:14px; }
.read-item { background:#fff; border:1.5px solid #e0e0d8; border-radius:14px; padding:16px; }
.read-q { font-size:15px; font-weight:700; line-height:1.65; margin-bottom:12px; color:#1a1a1a; }
.read-opts { display:grid; gap:6px; }
.read-opt { font-size:14px; padding:8px 10px; border-radius:9px; display:flex; gap:10px; line-height:1.5; }
.read-opt.ans-row { background:#e8f5e9; font-weight:700; color:#2e7d32; }
.read-opt.nor-row { color:#555; }
.read-num { min-width:22px; font-weight:700; flex-shrink:0; }

/* ── 閱讀：翻牌 ── */
.flip-card { background:#fff; border:1.5px solid #e0e0d8; border-radius:14px; padding:20px; margin-bottom:16px; }
.flip-q { font-size:17px; font-weight:700; line-height:1.7; margin-bottom:18px; }
.flip-opts { display:grid; gap:10px; margin-bottom:16px; }
.flip-opt { border:2px solid #e0e0d8; border-radius:11px; padding:13px 14px; display:flex; gap:12px; font-size:15px; line-height:1.5; }
.flip-opt.reveal-ok { border-color:#2e7d32; background:#e8f5e9; color:#2e7d32; font-weight:700; }
.flip-opt.reveal-ng { border-color:#ddd; background:#fafafa; color:#bbb; }
.flip-reveal-btn { width:100%; padding:15px; background:#f0f0eb; border:none; border-radius:11px; font-size:15px; cursor:pointer; font-family:inherit; font-weight:700; -webkit-appearance:none; }
.flip-reveal-btn:active { background:#e0e0d8; }
.flip-nav { display:flex; gap:10px; margin-top:12px; }

/* ── 閱讀：章節 ── */
.chapter-tabs { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:18px; }
.ch-tab { padding:9px 16px; border-radius:22px; border:1.5px solid #ddd; background:#fff; font-size:13px; cursor:pointer; font-family:inherit; font-weight:600; min-height:40px; }
.ch-tab:active { opacity:.7; }
.ch-tab.active { background:#185FA5; color:#fff; border-color:#185FA5; }
.ch-qs { display:grid; gap:14px; }

/* ── 閱讀：課本式 ── */
.textbook-wrap { display:grid; gap:14px; }
.tb-section { background:#fff; border-radius:14px; border:1.5px solid #e0e0d8; overflow:hidden; }
.tb-header { padding:16px 16px; display:flex; justify-content:space-between; align-items:center; cursor:pointer; min-height:56px; }
.tb-header:active { background:#f5f5f0; }
.tb-header-left { font-size:15px; font-weight:700; }
.tb-arrow { font-size:16px; color:#aaa; transition:transform .2s; }
.tb-arrow.open { transform:rotate(180deg); }
.tb-body { border-top:1px solid #f0f0eb; padding:16px; display:grid; gap:16px; }
.tb-q-num { font-size:11px; color:#bbb; font-weight:700; margin-bottom:4px; letter-spacing:.5px; }
.tb-q-text { font-size:15px; font-weight:700; line-height:1.65; margin-bottom:10px; }
.tb-opt-row { display:flex; gap:10px; font-size:14px; line-height:1.55; padding:4px 0; }
.tb-opt-row.tb-ans { color:#2e7d32; font-weight:700; }
.tb-opt-row.tb-nor { color:#777; }
</style>
</head>
<body>

<!-- ═══════════════════════════════ 首頁 ═══════════════════════════════ -->
<div class="container" id="home-screen">
  <h1>室內配線學科考試系統</h1>
  <p class="subtitle">00700 室內配線─屋內線路裝修 丙級技術士技能檢定</p>

  <div class="section-title">📝 考試模式</div>
  <div class="card-grid">
    <div class="menu-card" id="mc-exam80" onclick="pickMode('exam80')">
      <span class="icon">📋</span>
      <div><div class="mc-title">模擬正式考試</div><div class="mc-desc">80題・100分鐘</div></div>
    </div>
    <div class="menu-card" id="mc-practice" onclick="pickMode('practice')">
      <span class="icon">🔄</span>
      <div><div class="mc-title">隨機練習</div><div class="mc-desc">自選題數・即時答案</div></div>
    </div>
    <div class="menu-card" id="mc-category" onclick="pickMode('category')">
      <span class="icon">📚</span>
      <div><div class="mc-title">分類練習</div><div class="mc-desc">依科目練習</div></div>
    </div>
  </div>

  <div class="section-title">📖 閱讀模式</div>
  <div class="card-grid">
    <div class="menu-card" id="mc-read-list" onclick="pickMode('read-list')">
      <span class="icon">📄</span>
      <div><div class="mc-title">條列閱讀</div><div class="mc-desc">所有題目與答案</div></div>
    </div>
    <div class="menu-card" id="mc-read-flip" onclick="pickMode('read-flip')">
      <span class="icon">🃏</span>
      <div><div class="mc-title">翻牌閱讀</div><div class="mc-desc">點開才看答案</div></div>
    </div>
    <div class="menu-card" id="mc-read-chapter" onclick="pickMode('read-chapter')">
      <span class="icon">🗂️</span>
      <div><div class="mc-title">章節閱讀</div><div class="mc-desc">依工作項目分類</div></div>
    </div>
    <div class="menu-card" id="mc-read-textbook" onclick="pickMode('read-textbook')">
      <span class="icon">📘</span>
      <div><div class="mc-title">課本式閱讀</div><div class="mc-desc">可收折每科題目</div></div>
    </div>
  </div>

  <!-- 科目選擇（分類練習） -->
  <div id="cat-section" class="hidden">
    <p class="section-title">選擇科目</p>
    <div class="subj-list">
      <div class="subj-item" onclick="startCategory('indoor_wiring')"><span class="subj-name">室內配線專業科目</span><span class="subj-count">50 題</span></div>
      <div class="subj-item" onclick="startCategory('safety')"><span class="subj-name">職業安全衛生</span><span class="subj-count">20 題</span></div>
      <div class="subj-item" onclick="startCategory('ethics')"><span class="subj-name">工作倫理與職業道德</span><span class="subj-count">15 題</span></div>
      <div class="subj-item" onclick="startCategory('environment')"><span class="subj-name">環境保護</span><span class="subj-count">20 題</span></div>
      <div class="subj-item" onclick="startCategory('energy')"><span class="subj-name">節能減碳</span><span class="subj-count">20 題</span></div>
    </div>
  </div>

  <!-- 設定（exam80 / practice） -->
  <div id="setup-section" class="hidden">
    <p class="section-title">選擇科目（可複選）</p>
    <div class="tags" id="subject-tags">
      <button class="tag tw" data-subj="indoor_wiring" onclick="toggleSubj(this)">專業科目</button>
      <button class="tag ts" data-subj="safety"        onclick="toggleSubj(this)">職業安衛</button>
      <button class="tag te" data-subj="ethics"        onclick="toggleSubj(this)">工作倫理</button>
      <button class="tag tv" data-subj="environment"   onclick="toggleSubj(this)">環境保護</button>
      <button class="tag tn" data-subj="energy"        onclick="toggleSubj(this)">節能減碳</button>
    </div>
    <div class="range-row" id="count-row" style="display:none">
      <label>練習題數</label>
      <input type="range" id="count-slider" min="5" max="50" step="5" value="20"
             oninput="document.getElementById('count-val').textContent=this.value">
      <span class="range-val" id="count-val">20</span>
    </div>
    <button class="btn-go" onclick="startExam()">開始考試 →</button>
  </div>

  <!-- 閱讀科目選擇 -->
  <div id="read-subj-section" class="hidden">
    <p class="section-title">選擇科目（可複選）</p>
    <div class="tags" id="read-subj-tags">
      <button class="tag tw" data-subj="indoor_wiring" onclick="toggleReadSubj(this)">專業科目</button>
      <button class="tag ts" data-subj="safety"        onclick="toggleReadSubj(this)">職業安衛</button>
      <button class="tag te" data-subj="ethics"        onclick="toggleReadSubj(this)">工作倫理</button>
      <button class="tag tv" data-subj="environment"   onclick="toggleReadSubj(this)">環境保護</button>
      <button class="tag tn" data-subj="energy"        onclick="toggleReadSubj(this)">節能減碳</button>
    </div>
    <button class="btn-go" onclick="startRead()">開始閱讀 →</button>
  </div>
</div>

<!-- ═══════════════════════════════ 考試畫面 ═══════════════════════════════ -->
<div class="hidden" id="quiz-screen">
  <div class="quiz-body">
    <div class="quiz-header">
      <button class="btn-back" onclick="goHome()">← 返回</button>
      <span class="q-counter" id="q-counter">1 / 80</span>
      <span class="timer hidden" id="timer">100:00</span>
      <button class="btn-back hidden" id="show-score-btn" onclick="showResult()" style="color:#185FA5;font-weight:700;">📊 成績</button>
    </div>
    <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
    <span class="subj-badge" id="subj-badge"></span>
    <div class="q-text" id="q-text"></div>
    <div class="opts" id="opts"></div>
  </div>
  <div class="quiz-footer">
    <div class="nav-row">
      <button class="nav-btn hidden" id="prev-btn" onclick="navigate(-1)">← 上一題</button>
      <button class="nav-btn" id="next-btn">下一題 →</button>
    </div>
  </div>
</div>

<!-- ═══════════════════════════════ 結果畫面 ═══════════════════════════════ -->
<div class="container hidden" id="result-screen">
  <div id="score-card-wrap"></div>
  <div class="result-list" id="result-list"></div>
  <div style="display:grid;gap:10px;margin-top:4px">
    <button class="btn-go" onclick="reviewExam()">📝 返回重新作答</button>
    <button class="btn-sec" onclick="goHome()">🏠 返回首頁</button>
  </div>
</div>

<!-- ═══════════════════════════════ 閱讀畫面 ═══════════════════════════════ -->
<div class="container hidden" id="read-screen">
  <div class="quiz-header" style="margin-bottom:16px">
    <button class="btn-back" onclick="goHome()">← 返回</button>
    <span id="read-screen-title" style="font-size:14px;font-weight:700;color:#555"></span>
    <span></span>
  </div>
  <div id="read-content"></div>
</div>

<script>
/* ════════════════ 資料 ════════════════ */
const SUBJECTS = {
  indoor_wiring:{ name:"室內配線專業科目", short:"專業", tc:"tw", badge:"background:#E6F1FB;color:#185FA5" },
  safety:       { name:"職業安全衛生",     short:"安衛", tc:"ts", badge:"background:#EAF3DE;color:#3B6D11" },
  ethics:       { name:"工作倫理與職業道德",short:"倫理", tc:"te", badge:"background:#EEEDFE;color:#534AB7" },
  environment:  { name:"環境保護",         short:"環保", tc:"tv", badge:"background:#E1F5EE;color:#0F6E56" },
  energy:       { name:"節能減碳",         short:"節能", tc:"tn", badge:"background:#FAEEDA;color:#854F0B" },
};
const ALL_SUBJS = Object.keys(SUBJECTS);
const NUMS = ["①","②","③","④"];

const QB = {
indoor_wiring:[
  {q:"單相電容器起動型電動機之電容器，下列敘述何者正確？",o:["電容器並接於起動繞組","電容器串接於起動繞組","電容器並接於運轉繞組","電容器串接於運轉繞組"],a:1},
  {q:"變壓器必須考慮極性之時機為",o:["單相變壓器作屋內使用時","單相變壓器作降壓使用時","單相變壓器作屋外使用時","單相變壓器作三相連接時"],a:3},
  {q:"低壓電源其電壓在150～600V以內之電容器，其外箱應按何種接地施工？",o:["第一種","特種","第二種","第三種"],a:3},
  {q:"電動機使用電磁開關作正逆轉控制要有互鎖功能，其主要目的在",o:["防止過載","防止接點接觸不良","防止主電路短路","接線方便"],a:2},
  {q:"銅是一種",o:["半導體材料","非磁性材料","絕緣材料","磁性材料"],a:1},

/* ════════════════ 狀態 ════════════════ */
let currentMode = null;
let selectedSubjs = [...ALL_SUBJS];
let readSubjs    = [...ALL_SUBJS];
let questions=[], current=0, answers={}, revealed={};
let timerInterval=null, timeLeft=0;
let flipCur=0, flipRevealed=false;

/* ════════════════ 工具 ════════════════ */
function shuffle(arr){ const a=[...arr]; for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
function badgeHtml(s){ return `<span class="subj-badge" style="${SUBJECTS[s].badge};font-size:11px;font-weight:700;padding:3px 10px;border-radius:12px;">${SUBJECTS[s].short}</span>`; }
function show(id){ document.getElementById(id).classList.remove('hidden'); }
function hide(id){ document.getElementById(id).classList.add('hidden'); }
function hideAll(){ ['home-screen','quiz-screen','result-screen','read-screen'].forEach(hide); }

/* ════════════════ 首頁邏輯 ════════════════ */
function pickMode(m){
  currentMode=m;
  document.querySelectorAll('.menu-card').forEach(c=>c.classList.remove('active'));
  document.getElementById('mc-'+m).classList.add('active');
  hide('cat-section'); hide('setup-section'); hide('read-subj-section');
  if(m==='category'){ show('cat-section'); }
  else if(m==='exam80'||m==='practice'){
    show('setup-section');
    document.getElementById('count-row').style.display = m==='practice'?'flex':'none';
  } else {
    show('read-subj-section');
  }
}
function toggleSubj(btn){
  const s=btn.dataset.subj, idx=selectedSubjs.indexOf(s);
  if(idx>=0){ if(selectedSubjs.length>1){ selectedSubjs.splice(idx,1); btn.className='tag'; } }
  else{ selectedSubjs.push(s); btn.className='tag '+SUBJECTS[s].tc; }
}
function toggleReadSubj(btn){
  const s=btn.dataset.subj, idx=readSubjs.indexOf(s);
  if(idx>=0){ if(readSubjs.length>1){ readSubjs.splice(idx,1); btn.className='tag'; } }
  else{ readSubjs.push(s); btn.className='tag '+SUBJECTS[s].tc; }
}

/* ════════════════ 考試邏輯 ════════════════ */
function buildQuestions(subjs, count){
  let pool=[];
  subjs.forEach(s=>{ (QB[s]||[]).forEach((q,i)=>pool.push({...q,subj:s,id:s+'_'+i})); });
  return shuffle(pool).slice(0,Math.min(count,pool.length));
}
function startExam(){
  const count = currentMode==='exam80'?80:parseInt(document.getElementById('count-slider').value);
  questions=buildQuestions(selectedSubjs,count);
  current=0; answers={}; revealed={}; examDone=false;
  document.getElementById('show-score-btn').classList.add('hidden');
  if(currentMode==='exam80'){ timeLeft=6000; startTimer(); }
  hideAll(); show('quiz-screen'); renderQ();
}
function startCategory(subj){
  questions=shuffle(QB[subj]||[]).map((q,i)=>({...q,subj,id:subj+'_'+i}));
  current=0; answers={}; revealed={};
  currentMode='category';
  hideAll(); show('quiz-screen'); renderQ();
}
function startTimer(){
  clearInterval(timerInterval);
  const el=document.getElementById('timer'); el.classList.remove('hidden');
  timerInterval=setInterval(()=>{
    timeLeft--;
    const m=Math.floor(timeLeft/60),s=timeLeft%60;
    el.textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
    if(timeLeft<300) el.classList.add('urgent');
    if(timeLeft<=0){ clearInterval(timerInterval); finishExam(); }
  },1000);
}
let examDone = false;  // 是否已交卷
function renderQ(){
  const q=questions[current]; if(!q) return;
  const ua=answers[q.id], isRev=revealed[q.id];
  const isPrac=currentMode==='practice'||currentMode==='category';
  // 模擬考試交卷後：顯示對錯但不鎖住，可重新作答
  const isExamReview = currentMode==='exam80' && examDone;
  document.getElementById('q-counter').textContent=(current+1)+' / '+questions.length;
  document.getElementById('progress-fill').style.width=((current+1)/questions.length*100)+'%';
  document.getElementById('subj-badge').textContent=SUBJECTS[q.subj].name;
  document.getElementById('subj-badge').setAttribute('style',SUBJECTS[q.subj].badge+';font-size:11px;font-weight:700;padding:3px 10px;border-radius:12px;');
  document.getElementById('q-text').textContent=(current+1)+'. '+q.q;
  const optsEl=document.getElementById('opts'); optsEl.innerHTML='';
  q.o.forEach((opt,i)=>{
    let cls='opt';
    if(isExamReview){
      // 交卷後顯示對錯，不加 locked，可重選
      if(i===q.a) cls+=' correct';
      else if(ua===i) cls+=' wrong';
    } else if(isRev){
      if(i===q.a) cls+=' correct locked';
      else if(ua===i) cls+=' wrong locked';
      else cls+=' locked';
    } else if(ua===i) cls+=' selected';
    const d=document.createElement('div'); d.className=cls;
    d.innerHTML=`<span class="opt-num">${NUMS[i]}</span><span class="opt-text">${opt}</span>`;
    // 交卷後或練習模式均可點選（交卷後允許重新作答）
    if(!isRev || isExamReview) d.onclick=()=>pickAns(q.id,i,q.a,isPrac,isExamReview);
    optsEl.appendChild(d);
  });
  const pb=document.getElementById('prev-btn'), nb=document.getElementById('next-btn');
  pb.classList.toggle('hidden',current===0);
  if(isExamReview){
    // 交卷後返回作答模式：最後一題顯示「再次查看成績」
    if(current===questions.length-1){
      nb.textContent='📊 查看成績'; nb.className='nav-btn finish'; nb.onclick=showResult; nb.style.cssText='';
    } else {
      nb.textContent='下一題 →'; nb.className='nav-btn active-next'; nb.style.cssText='';
      nb.onclick=()=>navigate(1);
    }
  } else if(current===questions.length-1){
    nb.textContent='✓ 交卷查看結果'; nb.className='nav-btn finish'; nb.onclick=finishExam; nb.style.cssText='';
  } else {
    nb.textContent='下一題 →';
    const can=isPrac||ua!==undefined;
    nb.className='nav-btn'+(can?' active-next':'');
    nb.onclick=can?()=>navigate(1):null;
    nb.style.cursor=can?'pointer':'not-allowed'; nb.style.opacity=can?'1':'0.5';
  }
}
function pickAns(qid,i,correct,reveal,isReview){
  if(!isReview && answers[qid]!==undefined) return; // 正常模式只能選一次
  answers[qid]=i; if(reveal) revealed[qid]=true; renderQ();
}
function navigate(dir){ current+=dir; current=Math.max(0,Math.min(questions.length-1,current)); renderQ(); }
function finishExam(){
  clearInterval(timerInterval);
  examDone = true;
  showResult();
}
function showResult(){
  let correct=0; questions.forEach(q=>{ if(answers[q.id]===q.a) correct++; });
  const pct=Math.round(correct/questions.length*100), pass=pct>=60;
  hideAll(); show('result-screen');
  document.getElementById('score-card-wrap').innerHTML=`<div class="score-card ${pass?'pass':'fail'}"><div class="score-num">${pct}分</div><div class="score-lbl">${pass?'✓ 通過':'✗ 未通過'} — ${correct}/${questions.length} 題正確</div></div>`;
  const rl=document.getElementById('result-list'); rl.innerHTML='';
  questions.forEach((q,i)=>{
    const ua=answers[q.id], ok=ua===q.a;
    const d=document.createElement('div'); d.className='ri '+(ok?'ok':'ng');
    let ah=''; if(!ok&&ua!==undefined) ah+=`<div class="ans-ng">✗ 你的答案：${NUMS[ua]} ${q.o[ua]}</div>`;
    ah+=`<div class="ans-ok">✓ 正確答案：${NUMS[q.a]} ${q.o[q.a]}</div>`;
    d.innerHTML=`<div style="display:flex;gap:8px;align-items:flex-start;margin-bottom:7px">${badgeHtml(q.subj)}<span class="ri-q">${i+1}. ${q.q}</span></div><div class="ri-ans">${ah}</div>`;
    rl.appendChild(d);
  });
}
function reviewExam(){
  // 返回題目畫面，保留答案，可重新作答，顯示對錯提示
  current=0;
  hideAll(); show('quiz-screen');
  document.getElementById('show-score-btn').classList.remove('hidden');
  document.getElementById('timer').classList.add('hidden');
  renderQ();
}

/* ════════════════ 閱讀模式 ════════════════ */
function startRead(){
  hideAll(); show('read-screen');
  const titles={'read-list':'📄 條列閱讀','read-flip':'🃏 翻牌閱讀','read-chapter':'🗂️ 章節閱讀','read-textbook':'📘 課本式閱讀'};
  document.getElementById('read-screen-title').textContent = titles[currentMode]||'';
  const rc=document.getElementById('read-content'); rc.innerHTML='';

  const pool=[];
  readSubjs.forEach(s=>{ (QB[s]||[]).forEach((q,i)=>pool.push({...q,subj:s,idx:i})); });

  if(currentMode==='read-list') renderReadList(rc, pool);
  else if(currentMode==='read-flip') renderReadFlip(rc, pool);
  else if(currentMode==='read-chapter') renderReadChapter(rc);
  else if(currentMode==='read-textbook') renderReadTextbook(rc);
}

/* ── 條列閱讀 ── */
function renderReadList(rc, pool){
  const wrap=document.createElement('div'); wrap.className='read-list-wrap';
  pool.forEach((q,gi)=>{
    const d=document.createElement('div'); d.className='read-item';
    let oh='';
    q.o.forEach((opt,i)=>{
      const isAns=i===q.a;
      oh+=`<div class="read-opt ${isAns?'ans-row':'nor-row'}"><span class="read-num">${NUMS[i]}</span><span>${opt}${isAns?' ✓':''}</span></div>`;
    });
    d.innerHTML=`${badgeHtml(q.subj)}<div class="read-q" style="margin-top:8px">${gi+1}. ${q.q}</div><div class="read-opts">${oh}</div>`;
    wrap.appendChild(d);
  });
  rc.appendChild(wrap);
}

/* ── 翻牌閱讀 ── */
let flipPool=[], flipIdx=0;
function renderReadFlip(rc, pool){
  flipPool=pool; flipIdx=0; renderFlipCard(rc);
}
function renderFlipCard(rc){
  rc.innerHTML='';
  if(flipPool.length===0){ rc.innerHTML='<p style="color:#888;text-align:center;padding:40px">無題目</p>'; return; }
  const q=flipPool[flipIdx];
  const card=document.createElement('div'); card.className='flip-card';
  let oh='';
  q.o.forEach((opt,i)=>{ oh+=`<div class="flip-opt" id="fopt-${i}"><span style="min-width:20px;font-weight:700">${NUMS[i]}</span><span>${opt}</span></div>`; });
  card.innerHTML=`
    ${badgeHtml(q.subj)}
    <div class="flip-q" style="margin-top:8px">${flipIdx+1} / ${flipPool.length}．${q.q}</div>
    <div class="flip-opts">${oh}</div>
    <button class="flip-reveal-btn" id="flip-reveal-btn" onclick="doFlipReveal(${q.a})">👁 點擊顯示答案</button>`;
  const nav=document.createElement('div'); nav.className='flip-nav';
  if(flipIdx>0){
    const pb=document.createElement('button'); pb.className='nav-btn'; pb.textContent='← 上一題';
    pb.onclick=()=>{ flipIdx--; renderFlipCard(rc); }; nav.appendChild(pb);
  }
  if(flipIdx<flipPool.length-1){
    const nb=document.createElement('button'); nb.className='nav-btn active-next'; nb.textContent='下一題 →';
    nb.onclick=()=>{ flipIdx++; renderFlipCard(rc); }; nav.appendChild(nb);
  }
  rc.appendChild(card); rc.appendChild(nav);
}
function doFlipReveal(ans){
  document.getElementById('flip-reveal-btn').style.display='none';
  for(let i=0;i<4;i++){
    const el=document.getElementById('fopt-'+i);
    if(el) el.className='flip-opt '+(i===ans?'reveal-ok':'reveal-ng');
  }
}

/* ── 章節閱讀 ── */
function renderReadChapter(rc){
  const tabs=document.createElement('div'); tabs.className='chapter-tabs';
  readSubjs.forEach((s,idx)=>{
    const btn=document.createElement('button'); btn.className='ch-tab'+(idx===0?' active':'');
    btn.textContent=SUBJECTS[s].name; btn.dataset.subj=s;
    btn.onclick=()=>{
      document.querySelectorAll('.ch-tab').forEach(t=>t.classList.remove('active'));
      btn.classList.add('active'); renderChapterBody(qBody, s);
    };
    tabs.appendChild(btn);
  });
  const qBody=document.createElement('div'); qBody.className='ch-qs';
  rc.appendChild(tabs); rc.appendChild(qBody);
  if(readSubjs.length>0) renderChapterBody(qBody, readSubjs[0]);
}
function renderChapterBody(container, subj){
  container.innerHTML='';
  (QB[subj]||[]).forEach((q,i)=>{
    const d=document.createElement('div'); d.className='read-item';
    let oh='';
    q.o.forEach((opt,j)=>{
      const isAns=j===q.a;
      oh+=`<div class="read-opt ${isAns?'ans-row':'nor-row'}"><span class="read-num">${NUMS[j]}</span><span>${opt}${isAns?' ✓':''}</span></div>`;
    });
    d.innerHTML=`<div class="read-q">${i+1}. ${q.q}</div><div class="read-opts">${oh}</div>`;
    container.appendChild(d);
  });
}

/* ── 課本式閱讀 ── */
function renderReadTextbook(rc){
  const wrap=document.createElement('div'); wrap.className='textbook-wrap';
  readSubjs.forEach(s=>{
    const sec=document.createElement('div'); sec.className='tb-section';
    const hdr=document.createElement('div'); hdr.className='tb-header';
    hdr.innerHTML=`<span class="tb-header-left">${SUBJECTS[s].name} <span style="font-size:12px;color:#999;font-weight:400">${QB[s].length} 題</span></span><span class="tb-arrow" id="arr-${s}">▼</span>`;
    const body=document.createElement('div'); body.className='tb-body'; body.id='tb-body-'+s; body.style.display='none';
    (QB[s]||[]).forEach((q,i)=>{
      const qd=document.createElement('div');
      let oh='';
      q.o.forEach((opt,j)=>{
        oh+=`<div class="tb-opt-row ${j===q.a?'tb-ans':'tb-nor'}"><span style="min-width:20px;font-weight:700">${NUMS[j]}</span><span>${opt}${j===q.a?' ✓':''}</span></div>`;
      });
      qd.innerHTML=`<div class="tb-q-num">第 ${i+1} 題</div><div class="tb-q-text">${q.q}</div>${oh}`;
      body.appendChild(qd);
    });
    hdr.onclick=()=>{
      const open=body.style.display!=='none';
      body.style.display=open?'none':'grid';
      document.getElementById('arr-'+s).classList.toggle('open',!open);
    };
    sec.appendChild(hdr); sec.appendChild(body); wrap.appendChild(sec);
  });
  rc.appendChild(wrap);
}

/* ════════════════ 返回首頁 ════════════════ */
function goHome(){
  clearInterval(timerInterval);
  hideAll(); show('home-screen');
  document.getElementById('timer').classList.add('hidden');
  document.getElementById('timer').classList.remove('urgent');
  hide('cat-section'); hide('setup-section'); hide('read-subj-section');
  document.querySelectorAll('.menu-card').forEach(c=>c.classList.remove('active'));
  currentMode=null;
}
</script>

<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js')
